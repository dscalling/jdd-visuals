<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Vielen Dank für deine Anfrage bei JDD Visuals.">
  <title>Danke für deine Anfrage — JDD Visuals</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body{overflow-x:hidden}
    .thanks-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:
      radial-gradient(circle at 50% 35%,rgba(101,137,171,.16),transparent 38%),
      radial-gradient(circle at 15% 85%,rgba(255,255,255,.04),transparent 28%),#050505}
    .thanks-card{position:relative;width:min(820px,100%);padding:clamp(42px,7vw,78px);border:1px solid #252525;background:linear-gradient(145deg,rgba(17,17,17,.96),rgba(6,6,6,.98));text-align:center;box-shadow:0 40px 120px rgba(0,0,0,.55);overflow:hidden}
    .thanks-card:before{content:"";position:absolute;inset:-40% 20% auto;height:280px;background:radial-gradient(circle,rgba(121,156,190,.12),transparent 68%);pointer-events:none}
    .thanks-brand{position:relative;font-size:22px;font-weight:900;letter-spacing:-1.5px;margin-bottom:48px}
    .thanks-brand span{font-size:10px;letter-spacing:5px;color:#777;margin-left:10px}
    .thanks-icon{position:relative;width:72px;height:72px;margin:0 auto 30px;border:1px solid #6f8ca8;border-radius:50%;display:grid;place-items:center;color:#a8c1d9;font-size:28px;box-shadow:0 0 50px rgba(91,126,160,.14)}
    .thanks-eyebrow{position:relative;color:#849bb1;font-size:10px;letter-spacing:4px;text-transform:uppercase;margin-bottom:22px}
    .thanks-card h1{position:relative;margin:0;font-size:clamp(48px,8vw,92px);line-height:.9;letter-spacing:-6px}
    .thanks-card h1 span{color:#89a8ca}
    .thanks-card p{position:relative;max-width:570px;margin:30px auto;color:#858585;font-size:14px;line-height:1.8}
    .thanks-card .button{position:relative;margin-top:10px}
    .thanks-meta{position:relative;margin-top:42px;color:#4e4e4e;font-size:9px;letter-spacing:4px;text-transform:uppercase}
    @media(max-width:600px){.thanks-card h1{letter-spacing:-3px}.thanks-card{padding:42px 24px}.thanks-brand{margin-bottom:38px}}
  </style>
</head>
<body>
  <div class="noise"></div>
  <main class="thanks-page">
    <section class="thanks-card">
      <div class="thanks-brand">JDD <span>VISUALS</span></div>
      <div class="thanks-icon">✓</div>
      <div class="thanks-eyebrow">Anfrage erfolgreich gesendet</div>
      <h1>Danke für<br><span>deine Anfrage.</span></h1>
      <p>Deine Nachricht ist bei uns angekommen. Wir schauen uns dein Projekt persönlich an und melden uns schnellstmöglich bei dir.</p>
      <a class="button primary big" href="./">Zurück zu JDD Visuals <span>↗</span></a>
      <div class="thanks-meta">Design · Digital · Visuals</div>
    </section>
  </main>
</body>
</html>
