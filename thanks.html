<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Vielen Dank — JDD Visuals</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:radial-gradient(circle at 50% 35%,rgba(65,105,145,.18),transparent 48%)}
    .thanks-card{width:min(760px,100%);border:1px solid #242424;background:linear-gradient(145deg,#0e0e0e,#060606);padding:70px;text-align:center;box-shadow:0 35px 100px rgba(0,0,0,.45)}
    .thanks-logo{font-size:25px;font-weight:900;letter-spacing:-2px;margin-bottom:45px}.thanks-logo span{font-size:11px;letter-spacing:5px;color:#777;margin-left:10px}
    .thanks-check{width:64px;height:64px;border:1px solid #718ba6;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;color:#a7bfd5;font-size:25px}
    .thanks-card h1{font-size:clamp(48px,7vw,82px);line-height:.9;letter-spacing:-5px;margin:0}.thanks-card h1 span{color:#809fc1}
    .thanks-card p{color:#888;line-height:1.8;max-width:570px;margin:28px auto}.thanks-meta{font-size:10px;letter-spacing:3px;color:#666;text-transform:uppercase;margin-top:30px}
    @media(max-width:600px){.thanks-card{padding:45px 25px}.thanks-card h1{letter-spacing:-3px}}
  </style>
</head>
<body>
  <div class="noise"></div>
  <main class="thanks-page">
    <section class="thanks-card">
      <div class="thanks-logo">JDD <span>VISUALS</span></div>
      <div class="thanks-check">✓</div>
      <p class="eyebrow">ANFRAGE ERFOLGREICH GESENDET</p>
      <h1>Danke für<br><span>deine Anfrage.</span></h1>
      <p>Wir haben deine Nachricht erhalten. Unser Team schaut sie sich persönlich an und meldet sich schnellstmöglich bei dir.</p>
      <a class="button primary big" href="./">Zurück zu JDD Visuals <span>↗</span></a>
      <div class="thanks-meta">Design · Digital · Visuals</div>
    </section>
  </main>
</body>
</html>
